<script>
const MAKE_WEBHOOK_URL = "https://hook.us2.make.com/1blfs5p6l3fwexrs1nnip5up7tk105me";

const form = document.getElementById('leadForm');
const msgBox = document.getElementById('formMsg');
const submitBtn = document.getElementById('submitBtn');
const modal = document.getElementById('paymentModal');
const closeModal = document.getElementById('closeModal');

// Función para mostrar mensajes
function showMsg(text, type){
  msgBox.className = 'msg ' + (type === 'success' ? 'success' : 'error');
  msgBox.textContent = text;
  msgBox.style.display = 'block';
  if(type === 'success') setTimeout(()=>{ msgBox.style.display='none'; }, 6000);
}

// Enviar formulario a Make.com
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending...';
  msgBox.style.display = 'none';

  const payload = {
    fullname: form.fullname.value.trim(),
    email: form.email.value.trim(),
    company: form.company.value.trim(),
    phone: form.phone.value.trim(),
    plan: form.plan.value,
    budget: form.budget.value.trim(),
    message: form.message.value.trim(),
    submitted_at: new Date().toISOString()
  };

  if(!payload.fullname || !payload.email || !payload.plan || !payload.message){
    showMsg('Please fill required fields: Name, Email, Plan, Message.', 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Send message';
    return;
  }

  try {
    const res = await fetch(MAKE_WEBHOOK_URL, {
      method: 'POST',
      mode: 'cors',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });

    if(res.ok){
      showMsg('Thanks — your message was sent. We will contact you soon.', 'success');
      form.reset();
    } else {
      showMsg('Error sending form. Please try again.', 'error');
    }
  } catch(err){
    console.error('Webhook error:', err);
    showMsg('Network error: please try again later.', 'error');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Send message';
  }
});

// Botones de selección de plan para abrir modal PayPal
document.querySelectorAll('.select-plan-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const plan = btn.dataset.plan || '';
    const price = btn.dataset.price || '';
    if(price){
      openPaymentModal(plan, price);
    } else {
      const sel = document.getElementById('plan');
      sel.value = plan;
      document.getElementById('contact').scrollIntoView({behavior:'smooth', block:'center'});
      document.getElementById('message').focus();
    }
  });
});

// Función abrir modal PayPal
function openPaymentModal(planName, priceValue){
  document.getElementById('modalPlanTitle').textContent = (planName || 'Plan') + ' Plan';
  document.getElementById('modalPlanPrice').textContent = '$' + priceValue;
  modal.style.display = 'flex';

  const container = document.getElementById('paypal-button-container');
  container.innerHTML = '';

  if(window.paypal){
    paypal.Buttons({
      style: { shape: 'rect', color: 'gold', layout: 'vertical', label: 'pay' },
      createOrder: function(data, actions) {
        return actions.order.create({
          purchase_units: [{ amount: { value: priceValue } }]
        });
      },
      onApprove: function(data, actions) {
        return actions.order.capture().then(function(details) {
          alert("Payment completed by " + (details.payer?.name?.given_name || 'customer') + ".");
          modal.style.display = 'none';
        });
      },
      onError: function(err){
        console.error('PayPal error', err);
        alert('Payment error. Please try again or contact us.');
      }
    }).render('#paypal-button-container');
  } else {
    container.innerHTML = '<p style="color:#ddd">PayPal SDK not loaded.</p>';
  }
}

// Cerrar modal
closeModal.addEventListener('click', ()=>{ modal.style.display='none'; });
window.addEventListener('click', (e)=>{ if(e.target===modal){ modal.style.display='none'; } });
</script>
